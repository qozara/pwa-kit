name: PWA Kit CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Typecheck
        run: npm run check

      - name: Run Lint
        run: npm run lint

      - name: Build Packages
        run: npm run build

      - name: Run Tests
        run: npm test
